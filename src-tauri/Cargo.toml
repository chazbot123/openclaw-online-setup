[package]
name = "openclaw-usb-portable"
version = "0.1.0"
description = "OpenClaw Windows USB portable shell"
authors = ["OpenAI Codex"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2.0.0", features = [] }
thiserror = "1"

[features]
default = []
